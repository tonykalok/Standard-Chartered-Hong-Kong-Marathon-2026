<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Chartered Hong Kong Marathon 2026</title>
    <style>
:root{--primary:#2563eb;--secondary:#64748b;--accent:#f59e0b;--bg:#f8fafc;--card-bg:#ffffff;--text:#1e293b}body{font-family:'Segoe UI',Tahoma,sans-serif;background-color:var(--bg);color:var(--text);margin:0;padding:20px}.container{max-width:1200px;margin:0 auto}#loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999}.spinner{width:50px;height:50px;border:5px solid #f3f3f3;border-top:5px solid var(--primary);border-radius:50%;animation:1s linear infinite spin}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}.stat-card{background:var(--card-bg);padding:20px;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);text-align:center;border-bottom:4px solid var(--primary)}.stat-card .value{font-size:2rem;font-weight:700;color:var(--primary)}.controls{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px;background:#fff;padding:15px;border-radius:8px}input,select{padding:12px;border:1px solid #ddd;border-radius:6px;flex:1;min-width:200px}#racer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}.racer-card{background:#fff;border-radius:10px;padding:15px;box-shadow:0 2px 4px rgba(0,0,0,.05);position:relative;border:1px solid #edf2f7}.bib-tag{position:absolute;top:0;right:0;background:var(--primary);color:#fff;padding:4px 12px;font-size:.8rem;border-bottom-left-radius:10px;font-weight:700}.time-box{display:flex;justify-content:space-between}.time-val{font-family:'Courier New',monospace;font-weight:700;color:var(--primary)}.pagination{display:flex;justify-content:center;align-items:center;gap:15px;margin:40px 0}.page-btn{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}.page-btn:disabled{background:#cbd5e1;cursor:not-allowed}.time-box{display:flex;justify-content:space-between;background:#f1f5f9;padding:10px;border-radius:6px;margin-top:15px;cursor:pointer;transition:background .2s}.time-box:hover{background:#e2e8f0}#modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:10001;justify-content:center;align-items:center;backdrop-filter:blur(5px)}#modal-content{background:var(--bg);width:90%;max-width:900px;max-height:90vh;border-radius:16px;overflow-y:auto;position:relative;padding:30px;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}.close-modal{position:sticky;top:0;float:right;font-size:2rem;cursor:pointer;color:var(--secondary);line-height:1}.modal-header{border-bottom:2px solid #e2e8f0;margin-bottom:20px;padding-bottom:10px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;margin-top:20px}.photo-item{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#eee;transition:transform .2s;cursor:zoom-in}.photo-item:hover{transform:scale(1.03)}.detail-pill{display:inline-block;background:#e2e8f0;padding:5px 12px;border-radius:20px;font-size:.85rem;margin-right:8px;margin-bottom:8px}
    </style>
</head>
<body>

<!-- IMPORTANT: The ID must match the JavaScript precisely -->
<div id="loader">
    <div class="spinner"></div>
    <h2 style="color: var(--primary); margin-top: 20px;">Loading 10,000+ Records</h2>
    <p>Decompressing dataset...</p>
</div>

<div class="container">
    <header style="margin-bottom: 30px;">
        <h1>Standard Chartered Hong Kong Marathon 2026</h1>
        <p style="color: var(--secondary);">Event Participant Performance & Analytics</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><h3>Matched</h3><div class="value" id="stat-total">0</div></div>
        <div class="stat-card"><h3>Male</h3><div class="value" id="stat-male">0</div></div>
        <div class="stat-card"><h3>Female</h3><div class="value" id="stat-female">0</div></div>
        <div class="stat-card"><h3>Categories</h3><div class="value" id="stat-cats">0</div></div>
    </div>

    <div class="controls">
		<!--Search Names or Bibs (split by , ; or space)...-->
        <input type="text" id="search-input" placeholder="Search by name or bib number...">
        <select id="category-filter"><option value="">All Categories</option></select>
    </div>

    <div id="racer-grid"></div>

    <div class="pagination">
        <button class="page-btn" id="prev-btn">Previous</button>
        <span id="page-info">Page 1 of 1</span>
        <button class="page-btn" id="next-btn">Next</button>
    </div>
</div>
